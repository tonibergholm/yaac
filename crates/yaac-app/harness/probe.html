<!doctype html>
<meta charset="utf-8">
<title>probe</title>
<script>
  // Loaded into the sidebar view by the harness. Same-origin, so the statuses are readable.
  // Expected: a text/plain POST is refused with 415, an OPTIONS request with 405.
  var rpc = 'app://ui/api/v1/rpc';
  var body = JSON.stringify({ v: 1, id: 2, body: { kind: 'query', body: { type: 'snapshot' } } });
  fetch(rpc, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: body })
    .then(function (r) { return r.status; }, function () { return 'err'; })
    .then(function (wrongType) {
      return fetch(rpc, { method: 'OPTIONS' })
        .then(function (r) { return wrongType + ' ' + r.status; }, function () { return wrongType + ' err'; });
    })
    .then(function (result) { document.title = 'probe ' + result; });
</script>
