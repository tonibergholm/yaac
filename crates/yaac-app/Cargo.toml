[package]
name = "yaac-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "yaac-app"
path = "src/main.rs"

# Helper processes (renderer, GPU, utility). Bundled as "yaac-app Helper*.app" by scripts/bundle-macos.sh.
[[bin]]
name = "yaac-app-helper"
path = "src/helper.rs"

[package.metadata.cef.bundle]
helper_name = "yaac-app-helper"

[dependencies]
yaac-core.workspace = true
yaac-store.workspace = true
yaac-engine.workspace = true
yaac-api.workspace = true
yaac-model.workspace = true
yaac-platform.workspace = true
yaac-cef = { path = "../yaac-cef" }
serde_json.workspace = true
tokio.workspace = true
