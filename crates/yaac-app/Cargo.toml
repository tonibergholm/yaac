[package]
name = "yaac-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
# The UI compiled into the binary. Required for release builds (the bundle script builds ui/dist).
default = ["embed-ui"]
embed-ui = ["yaac-cef/embed-ui"]
# Test entry points (harness, persistence checks, local site, directory UI assets) in release builds.
dev-tools = ["yaac-cef/dev-tools"]

[[bin]]
name = "yaac-app"
path = "src/main.rs"

# Helper processes (renderer, GPU, utility). Bundled as "yaac-app Helper*.app" by scripts/bundle-macos.sh.
[[bin]]
name = "yaac-app-helper"
path = "src/helper.rs"

[package.metadata.cef.bundle]
helper_name = "yaac-app-helper"

[dependencies]
yaac-core.workspace = true
yaac-store.workspace = true
yaac-engine.workspace = true
yaac-api.workspace = true
yaac-model.workspace = true
yaac-platform.workspace = true
yaac-cef = { path = "../yaac-cef" }
serde_json.workspace = true
tokio.workspace = true
