name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Layering rules
        run: python3 -I scripts/check-layering.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Tests (core testing feature, ts bindings)
        run: |
          cargo test -p yaac-core --features testing
          cargo test -p yaac-api --features ts
      - name: Generated TypeScript is current
        run: |
          cargo test -p yaac-api --features ts
          cargo test -p yaac-model --features ts
          test -z "$(git status --porcelain -- ui/src/generated)"
